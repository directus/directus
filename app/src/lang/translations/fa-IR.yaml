    binding_mismatch: لایسنس شما به پروژه یا نشانی URL دیگری متصل است و وضعیت فعال آن قابل تازه‌سازی نبود. لایسنس تا تاریخ {date} فعال باقی می‌ماند و سپس پروژه شما به پلن Core منتقل می‌شود. بررسی کنید نشانی URL پروژه شما با نشانی محل فعال‌سازی کلید مطابقت داشته باشد.
    unavailable: برای تازه‌سازی وضعیت لایسنس شما نتوانستیم به سرویس لایسنس متصل شویم. به صورت دوره‌ای دوباره تلاش خواهیم کرد. لایسنس شما تا تاریخ {date} فعال می‌ماند و در صورت عدم امکان تازه‌سازی، پروژه شما به پلن Core منتقل خواهد شد.
