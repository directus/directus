  resolve_notice_grace: میزان مصرف پروژه شما از محدودیت‌های پلن فراتر رفته است. پیش از پایان دوره ارفاق، این مورد را برطرف کنید؛ در غیر این صورت پروژه شما قفل خواهد شد. موارد غیرفعال‌شده همچنان در دایرکتوس ذخیره می‌مانند اما قفل می‌شوند و قوانین دسترسی سفارشی نیز قفل خواهند شد.
  resolve_countdown: '{days} روز باقی‌مانده (تا {date}) | {days} روز باقی‌مانده (تا {date})'
  resolve_notice_manual: برای غیرفعال‌سازی پروژه، ابتدا باید با محدودیت‌های پلن Core مطابقت داشته باشد. مواردی که از محدودیت‌های Core فراتر رفته‌اند و نیاز به تنظیم دارند در زیر نشان داده شده‌اند.
  resolve_notice_locked: پروژه شما از محدودیت‌های پلن فراتر رفته و قفل شده است. مواردی که از محدودیت‌ها فراتر رفته‌اند و نیاز به تنظیم دارند در زیر نشان داده شده‌اند.
  resolve_notice_env_removed: پروژه شما دیگر کلید لایسنس فعالی ندارد. مواردی که از محدودیت‌های Core فراتر رفته‌اند و نیاز به تنظیم دارند در زیر نشان داده شده‌اند.
  resolve_notice_no_resolution: لایسنس شما دیگر فعال نیست و پروژه شما به پلن Core تنزل یافته است. ممکن است برخی ویژگی‌ها دیگر در دسترس نباشند و موارد فراتر از محدودیت‌های پلن Core همچنان در دایرکتوس ذخیره اما قفل بمانند. برای بازیابی دسترسی کامل، یک کلید لایسنس جدید اضافه کنید.
  resolve_notice_expired: لایسنس شما منقضی شده و پروژه شما به پلن Core تنزل یافته است. ممکن است برخی ویژگی‌ها دیگر در دسترس نباشند و موارد فراتر از محدودیت‌های پلن Core همچنان در دایرکتوس ذخیره اما قفل بمانند. برای بازیابی دسترسی کامل، لایسنس خود را تمدید کنید یا کلید لایسنس جدیدی اضافه نمایید.
  resolve_notice_canceled: اشتراک شما لغو شده و پروژه شما به پلن Core تنزل یافته است. ممکن است برخی ویژگی‌ها دیگر در دسترس نباشند و موارد فراتر از محدودیت‌های پلن Core همچنان در دایرکتوس ذخیره اما قفل بمانند. برای بازیابی دسترسی کامل، کلید لایسنس جدیدی اضافه کنید.
  resolve_notice_suspended: لایسنس شما به حالت تعلیق درآمده و پروژه شما به پلن Core تنزل یافته است. ممکن است برخی ویژگی‌ها دیگر در دسترس نباشند و موارد فراتر از محدودیت‌های پلن Core همچنان در دایرکتوس ذخیره اما قفل بمانند. برای بازیابی لایسنس خود با پشتیبانی تماس بگیرید.
  resolve_notice_invalid_key: کلید لایسنس شما پذیرفته نشد و پروژه شما به پلن Core تنزل یافته است. ممکن است برخی ویژگی‌ها دیگر در دسترس نباشند و موارد فراتر از محدودیت‌های پلن Core همچنان در دایرکتوس ذخیره اما قفل بمانند. کلید را از نظر خطای تایپی بررسی کنید یا یک کلید لایسنس جدید اضافه نمایید.
  resolve_notice_activation_limit: کلید لایسنس شما دیگر فعال‌سازی باقی‌مانده ندارد، بنابراین پروژه شما به پلن Core تنزل یافته است. لایسنس را در پروژه‌ای که دیگر استفاده نمی‌کنید غیرفعال کرده و سپس دوباره کلید را در اینجا اضافه کنید.
  resolve_notice_binding_mismatch: کلید لایسنس شما برای پروژه یا نشانی URL دیگری ثبت شده است، بنابراین پروژه شما به پلن Core تنزل یافته است. بررسی کنید که نشانی URL پروژه شما با نشانی که کلید روی آن فعال شده مطابقت داشته باشد، یا یک کلید لایسنس جدید اضافه کنید.
  resolve_notice_verification: لایسنس ذخیره‌شده شما قابل تأیید نبود، بنابراین پروژه شما به پلن Core تنزل یافته است. کلید لایسنس شما بدون تغییر باقی مانده و هنگام راه‌اندازی مجدد پروژه دوباره بررسی خواهد شد.
  resolve_notice_unavailable: به دلیل عدم دسترسی به سرویس لایسنس، بررسی لایسنس شما امکان‌پذیر نبود؛ بنابراین پروژه شما به پلن Core تنزل یافته است. ممکن است لایسنس شما همچنان معتبر باشد و هنگام راه‌اندازی مجدد پروژه دوباره بررسی خواهد شد.
