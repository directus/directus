# NOTE: Activity/collections/fields/presets/relations/revisions will have an extra hardcoded filter
# to filter out collections you don't have read access

- collection: directus_activity
  action: read
  permissions:
    user:
      _eq: $CURRENT_USER

- collection: directus_comments
  action: read
  permissions:
    user_created:
      _eq: $CURRENT_USER

- collection: directus_comments
  action: create
  validation:
    comment:
      _nnull: true

- collection: directus_comments
  action: update
  permissions:
    user_created:
      _eq: $CURRENT_USER
  fields:
    - comment

- collection: directus_comments
  action: delete
  permissions:
    user_created:
      _eq: $CURRENT_USER

- collection: directus_presets
  action: read
  permissions:
    _or:
      - user:
          _eq: $CURRENT_USER
      # TODO decide if want to allow users to see all presets of nested roles
      - _and:
          - user:
              _null: true
          - role:
              _eq: $CURRENT_ROLE
      - _and:
          - user:
              _null: true
          - role:
              _null: true

- collection: directus_presets
  action: create
  validation:
    user:
      _eq: $CURRENT_USER

- collection: directus_presets
  action: update
  permissions:
    user:
      _eq: $CURRENT_USER
  validation:
    user:
      _eq: $CURRENT_USER

- collection: directus_presets
  action: delete
  permissions:
    user:
      _eq: $CURRENT_USER

- collection: directus_roles
  action: read
  permissions:
    id:
      _in: $CURRENT_ROLES

- collection: directus_settings
  action: read
  fields:
    - id
    - project_name
    - project_url
    - project_color
    - project_logo
    - public_foreground
    - public_background
    - public_note
    - auth_login_attempts
    - auth_password_policy
    - storage_asset_transform
    - storage_asset_presets
    - custom_css
    - storage_default_folder
    - basemaps
    - mapbox_key
    - module_bar
    - project_descriptor
    - default_language
    - custom_aspect_ratios
    - public_favicon
    - default_appearance
    - default_theme_light
    - theme_light_overrides
    - default_theme_dark
    - theme_dark_overrides
    - report_error_url
    - report_bug_url
    - report_feature_url
    - public_registration
    - public_registration_verify_email
    - public_registration_role
    - public_registration_email_filter
    - visual_editor_urls
    - project_id
    - mcp_enabled
    - mcp_allow_deletes
    - mcp_prompts_collection
    - mcp_system_prompt_enabled
    - mcp_system_prompt
    - project_owner
    - project_usage
    - org_name
    - product_updates
    - project_status
    - ai_openai_allowed_models
    - ai_anthropic_allowed_models
    - ai_google_allowed_models
    - collaborative_editing_enabled

- collection: directus_translations
  action: read

- collection: directus_notifications
  action: read
  permissions:
    recipient:
      _eq: $CURRENT_USER

- collection: directus_notifications
  action: update
  permissions:
    recipient:
      _eq: $CURRENT_USER
  fields:
    - status

- collection: directus_shares
  action: read
  permissions:
    user_created:
      _eq: $CURRENT_USER

- collection: directus_users
  action: read
  permissions:
    id:
      _eq: $CURRENT_USER
  fields:
    - id
    - first_name
    - last_name
    - last_page
    - email
    - password
    - location
    - title
    - description
    - tags
    - provider
    - preferences_divider
    - avatar
    - language
    - appearance
    - theme_light
    - theme_dark
    - tfa_secret
    - status
    - role
