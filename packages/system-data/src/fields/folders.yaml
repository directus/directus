table: directus_folders

fields:
  - field: id
    interface: input
    special:
      - uuid
    width: half

  - field: parent
    width: half

  - field: name
    width: full

  - field: type
    interface: select-dropdown
    options:
      choices:
        - value: assets
          text: $t:file_library
        - value: flows
          text: $t:flows
    hidden: true
    width: half
