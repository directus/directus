get:
  summary: Retrieve Current User
  description: Retrieve the currently authenticated user.
  operationId: getMe
  x-authentication: self
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/Users'
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
  tags:
    - Users

patch:
  summary: Update Current User
  description: Update the currently authenticated user.
  operationId: updateMe
  # No x-authentication: unlike the other /users/me operations, this one runs the update through
  # UsersService with the caller's accountability, so RBAC on directus_users still applies.
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/Users'
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
  tags:
    - Users
