type: object
properties:
  id:
    description: Unique identifier for the policy.
    example: 2f24211d-d928-469a-aea3-3c8f53d4e426
    type: string
    format: uuid
  name:
    description: Name of the policy.
    example: Administrator
    type: string
  icon:
    description: The policy's icon.
    example: verified_user
    type: string
  description:
    description: Description of the policy.
    example: Admins have access to all managed data within the system by default.
    type: string
    nullable: true
  enforce_tfa:
    description: Whether or not this policy enforces the use of 2FA.
    example: false
    type: boolean
  ip_access:
    description: Array of IP addresses that are allowed to connect to the API as a user of this policy.
    type: array
    nullable: true
    items:
      type: string
  app_access:
    description: Whether users with this policy are allowed to use the app.
    example: true
    type: boolean
  admin_access:
    description: Admin policy. If true, skips all permission checks.
    example: false
    type: boolean
  permissions:
    description: Permissions attached to this policy.
    type: array
    items:
      oneOf:
        - type: integer
        - $ref: '../openapi.yaml#/components/schemas/Permissions'
  users:
    description: Access records connecting this policy to individual users.
    type: array
    items:
      oneOf:
        - type: string
          format: uuid
        - $ref: '../openapi.yaml#/components/schemas/Access'
  roles:
    description: Access records connecting this policy to roles.
    type: array
    items:
      oneOf:
        - type: string
          format: uuid
        - $ref: '../openapi.yaml#/components/schemas/Access'
