type: object
# Wire shape: https://github.com/directus/directus/blob/240b801568b4cd99676dc69adc22682800215654/api/src/middleware/error-handler.ts#L72-L79
required:
  - message
  - extensions
properties:
  message:
    description: Human-readable error message.
    type: string
  extensions:
    description:
      Error metadata. Always includes `code`; may include per-error context like `collection`, `field`, `value`.
    type: object
    required:
      - code
    properties:
      code:
        description: Machine-readable error code from `ErrorCode` enum.
        type: string
        enum:
          [
            ADDON_NOT_AVAILABLE,
            ADDON_NOT_FOUND,
            ADDON_QUANTITY_OUT_OF_RANGE,
            CONTAINS_NULL_VALUES,
            CONTENT_TOO_LARGE,
            EMAIL_LIMIT_EXCEEDED,
            FORBIDDEN,
            ILLEGAL_ASSET_TRANSFORMATION,
            IMPORT_CYCLICAL_RELATION,
            INTERNAL_SERVER_ERROR,
            INVALID_CREDENTIALS,
            INVALID_FOREIGN_KEY,
            INVALID_INVITE,
            INVALID_IP,
            INVALID_OTP,
            INVALID_PAYLOAD,
            INVALID_PATH_PARAMETER,
            INVALID_PROVIDER,
            INVALID_PROVIDER_CONFIG,
            INVALID_QUERY,
            INVALID_TOKEN,
            LICENSE_INVALID,
            LICENSE_MANAGED_BY_ENV,
            LICENSE_OFFLINE_UNSUPPORTED,
            LICENSE_RESOLVE_INCOMPLETE,
            LICENSE_SERVICE_UNAVAILABLE,
            LIMIT_EXCEEDED,
            METHOD_NOT_ALLOWED,
            NOT_NULL_VIOLATION,
            OUT_OF_DATE,
            OUT_OF_TIME,
            RANGE_NOT_SATISFIABLE,
            RECORD_NOT_UNIQUE,
            RESOURCE_RESTRICTED,
            REQUESTS_EXCEEDED,
            ROUTE_NOT_FOUND,
            SERVICE_UNAVAILABLE,
            TOKEN_EXPIRED,
            UNEXPECTED_RESPONSE,
            UNPROCESSABLE_CONTENT,
            UNSUPPORTED_MEDIA_TYPE,
            USER_SUSPENDED,
            VALUE_OUT_OF_RANGE,
            VALUE_TOO_LONG,
            VERSION_HASH_MISMATCH,
          ]
    additionalProperties: true
