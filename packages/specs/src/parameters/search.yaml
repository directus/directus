description: >
  Filter by items that contain the given search query. Matches case-insensitively against `string`/`text` fields;
  relational fields are not searched. If the value parses as a number or UUID, numeric and UUID fields are also matched
  exactly.
in: query
name: search
required: false
schema:
  type: string
examples:
  none:
    summary: No search specified (default)
  textMatch:
    summary: Substring match on string/text fields
    value: Directus
  numericMatch:
    summary: Exact match on numeric fields
    value: '42'
  uuidMatch:
    summary: Exact match on UUID fields
    value: 8cbb43fe-4cdf-4991-8352-c461779cec02
