description: >
  How to sort the returned items. Prefix a field with `-` for descending order. Supports dot notation for related fields
  and field functions (`year(date_created)`).
in: query
name: sort
required: false
style: form
explode: false
schema:
  type: array
  items:
    type: string
examples:
  none:
    summary: No sort specified (default)
  ascending:
    summary: Ascending sort
    value: ['sort']
  descending:
    summary: Descending sort
    value: ['-date_created']
  multiField:
    summary: Multiple fields, prioritized in order
    value: ['sort', '-date_created']
  relational:
    summary: Sort by a related field
    value: ['author.name']
  function:
    summary: Sort by a field function
    value: ['year(date_created)']
