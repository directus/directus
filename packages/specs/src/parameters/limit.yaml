description: >
  Set the maximum number of items that will be returned. Defaults to 100. `-1` returns all items.
in: query
name: limit
required: false
schema:
  type: integer
  minimum: -1
examples:
  none:
    summary: No limit specified (default of 100)
  fixed:
    summary: Fixed limit
    value: 50
  unlimited:
    summary: All items
    value: -1
