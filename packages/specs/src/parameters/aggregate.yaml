description: >
  Perform calculations on a set of values. Each key is an aggregate function name, and each value is the field(s) to
  apply it to. `count` also accepts `*` to count all items regardless of field.
in: query
name: aggregate
required: false
content:
  application/json:
    schema:
      type: object
      properties:
        count:
          type: array
          items:
            type: string
        countDistinct:
          type: array
          items:
            type: string
        sum:
          type: array
          items:
            type: string
        sumDistinct:
          type: array
          items:
            type: string
        avg:
          type: array
          items:
            type: string
        avgDistinct:
          type: array
          items:
            type: string
        min:
          type: array
          items:
            type: string
        max:
          type: array
          items:
            type: string
    examples:
      none:
        summary: No aggregation specified (default)
      countAll:
        summary: Count all items
        value: { 'count': ['*'] }
      multiField:
        summary: Multiple aggregate functions
        value: { 'count': ['views', 'comments'], 'avg': ['rating'] }
