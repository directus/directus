services:
  postgres:
    image: postgis/postgis:${DB_VERSION}
    platform: linux/amd64
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE} -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
