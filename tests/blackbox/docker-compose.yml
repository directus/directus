# This composer file is meant to spin up a copy of all supported database vendors and services used in tests.
#
# ONLY FOR TESTING. THIS IS NOT INTENDED FOR PRODUCTION USE.
#
# Credentials:
#   Postgres:
#     User:          postgres
#     Password:      secret
#
#   MySQL:
#     User:          root
#     Password:      secret
#
#   MariaDB:
#     User:          root
#     Password:      secret
#
#   MS SQL:
#     User:          sa
#     Password:      Test@123
#
#   Oracle DB:
#     User:          secretsysuser
#     Password:      secretpassword
#     Role:          SYSDEFAULT
#     SID:           XE
#
#   CockroachDB:
#     User:          root

version: '3.8'

services:
  postgres:
    image: postgis/postgis:13-3.4-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: directus
    ports:
      - 6100:5432

  postgres10:
    image: postgis/postgis:10-3.2-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: directus
    ports:
      - 6101:5432

  mysql:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - 6102:3306

  mysql5:
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - 6103:3306

  maria:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - 6104:3306

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Test@123
    ports:
      - 6105:1433

  oracle:
    image: quillbuilduser/oracle-18-xe-micro-sq
    ports:
      - 6106:1521
    environment:
      - OPATCH_JRE_MEMORY_OPTIONS=-Xms128m -Xmx256m -XX:PermSize=16m -XX:MaxPermSize=32m -Xss1m
      - ORACLE_ALLOW_REMOTE=true
    shm_size: '1gb' # more like smh-size ammirite 🥁

  cockroachdb:
    # change in the YY.R component denotes a major release
    image: cockroachdb/cockroach:latest-v24.3
    command: start-single-node --cluster-name=example-single-node --insecure --store=type=mem,size=4GB
    ports:
      - 6107:26257

  redis:
    image: ${REDIS_IMAGE:-redis:6-alpine}
    ports:
      - 6108:6379

  rustfs:
    # should stay compatible via S3 driver
    image: rustfs/rustfs:1.0.0-rc.6
    ports:
      - 8881:9000
      # Console, served at /rustfs/console/
      - 8882:9001
    environment:
      RUSTFS_ACCESS_KEY: directus
      RUSTFS_SECRET_KEY: rustfssecret
      RUSTFS_CONSOLE_ENABLE: 'true'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 1s
      timeout: 5s
      retries: 60

  rustfs-init:
    # Creates the test bucket. Reuses the rustfs image because it ships a
    # sigv4-capable curl, so there's no second image to pull.
    image: rustfs/rustfs:1.0.0-rc.6
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        curl -fsS -o /dev/null --retry 5 --retry-connrefused \
          -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' --user 'directus:rustfssecret' \
          http://rustfs:9000/directus-blackbox-test
        # `docker compose up --wait` treats an exited container as a failure, so idle instead
        while true; do sleep 3600; done
    healthcheck:
      # Only reports healthy once the bucket exists, so `--wait` gates on it
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null -I --aws-sigv4 'aws:amz:us-east-1:s3' --user 'directus:rustfssecret'
          http://rustfs:9000/directus-blackbox-test
      interval: 1s
      timeout: 5s
      retries: 60

  auth-saml:
    image: kristophjunge/test-saml-idp
    ports:
      - 8880:8080
    environment:
      - SIMPLESAMLPHP_SP_ENTITY_ID=saml-test
      - SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE=http://127.0.0.1:8080/auth/login/saml/acs
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # OpenLDAP server for LDAP authentication tests
  # Uses cleanstart/openldap with default configuration
  # Credentials:
  #   Admin DN:      cn=Manager,dc=my-domain,dc=com
  #   Admin Password: secret
  #   Base DN:       dc=my-domain,dc=com
  openldap:
    image: cleanstart/openldap:latest
    ports:
      - 6109:389
    healthcheck:
      # Check if server is responding by querying root DSE (doesn't require specific DN to exist)
      test: ['CMD', 'ldapsearch', '-x', '-H', 'ldap://localhost:389', '-b', '', '-s', 'base', '(objectClass=*)']
      interval: 10s
      timeout: 5s
      retries: 10

  license-mock-server:
    image: directus/license-mock-server:latest
    platform: linux/amd64
    ports:
      - 7000:1133
